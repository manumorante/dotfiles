model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
personality = "pragmatic"
service_tier = "default"

[mcp_servers.playwright]
command = "npx"
args = ["@playwright/mcp@latest"]

[mcp_servers.playwright.tools.browser_evaluate]
approval_mode = "approve"

[mcp_servers.playwright.tools.browser_navigate]
approval_mode = "approve"

[mcp_servers.shortcut]
command = "npx"
args = ["-y", "@shortcut/mcp@latest"]

[mcp_servers.shortcut.env]
SHORTCUT_API_TOKEN = "[shortcut_api_token]"

[mcp_servers.shortcut.tools.stories-get-by-id]
approval_mode = "approve"

[mcp_servers.shortcut.tools.stories-get-history]
approval_mode = "approve"

[mcp_servers.shortcut.tools.stories-search]
approval_mode = "approve"

[mcp_servers.shortcut.tools.users-get-current]
approval_mode = "approve"

[mcp_servers.shortcut.tools.users-get-current-teams]
approval_mode = "approve"

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[mcp_servers.wisprflow]
url = "https://api.wisprflow.ai/connect/mcp"

[mcp_servers.linear]
url = "https://mcp.linear.app/mcp"

[features]
multi_agent = true
js_repl = false

[plugins."google-calendar@openai-curated"]
enabled = true

[plugins."github@openai-curated"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."unified-computer-use@openai-bundled"]
enabled = true

[plugins."code-review@openai-bundled"]
enabled = true

[desktop]
sansFontSize = 18
codeFontSize = 16
usePointerCursors = true
localeOverride = "en-US"
preventSleepWhileRunning = true
keepRemoteControlAwakeWhilePluggedIn = true
git-branch-prefix = "feat/"
git-create-pull-request-as-draft = false
git-show-sidebar-pr-icons = true
git-commit-instructions = """
You must always write commits in English.
You must use a lightweight format of the conventional commit."""
git-pr-instructions = ""
selected-avatar-id = "codex"
followUpQueueMode = "queue"
dock-icon-preference = "codex-system"
conversationDetailMode = "STEPS_COMMANDS"
realtimeVoiceScreenContextEnabled = true
avatar-overlay-mascot-width-px = 100

[desktop.open-in-target-preferences]
global = "cursor"

